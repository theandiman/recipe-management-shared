name: Manual Publish

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type (patch, minor, major, custom, or none)'
        required: false
        default: 'patch'
        type: choice
        options:
          - 'patch'
          - 'minor'
          - 'major'
          - 'custom'
          - 'none'
      custom_version:
        description: 'Explicit version string if version_bump is custom (e.g. 1.0.25)'
        required: false
        default: ''
        type: string
      publish_npm:
        description: 'Whether to publish the npm package'
        required: false
        default: true
        type: boolean
      publish_maven:
        description: 'Whether to publish the Maven package'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: manual-publish-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate and set target version
        id: versioning
        run: |
          BUMP="${{ inputs.version_bump }}"
          CUSTOM="${{ inputs.custom_version }}"
          
          CURRENT_VER=$(node -p "require('./package.json').version")
          echo "Current version in repository: $CURRENT_VER"
          
          if [ "$BUMP" = "patch" ] || [ "$BUMP" = "minor" ] || [ "$BUMP" = "major" ]; then
            npm version "$BUMP" --no-git-tag-version
            NEW_VER=$(node -p "require('./package.json').version")
          elif [ "$BUMP" = "custom" ]; then
            if [ -z "$CUSTOM" ]; then
              echo "Error: custom_version input is required when version_bump is custom" >&2
              exit 1
            fi
            npm version "$CUSTOM" --no-git-tag-version
            NEW_VER="$CUSTOM"
          else
            NEW_VER="$CURRENT_VER"
          fi

          echo "Target version to publish: $NEW_VER"
          
          # Sync pom.xml version
          if ! mvn -B org.codehaus.mojo:versions-maven-plugin:2.18.0:set -DnewVersion="$NEW_VER" -DgenerateBackupPoms=false; then
            echo "versions-maven-plugin failed; performing pom.xml edit fallback"
            perl -0777 -pe "s|(<project[^>]*>.*?<version>)(.*?)(</version>)|\1$NEW_VER\3|s" -i pom.xml
          fi
          
          TAG="v$NEW_VER"
          echo "version=$NEW_VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_bumped=$([ "$NEW_VER" != "$CURRENT_VER" ] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"

      - name: Ensure tag doesn't already exist remotely
        run: |
          TAG="${{ steps.versioning.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}"; then
            echo "Tag ${TAG} already exists on origin" >&2
            exit 1
          fi

      - name: Create tag on HEAD and push
        run: |
          TAG="${{ steps.versioning.outputs.tag }}"
          MESSAGE="Release ${TAG}"
          git tag -a "$TAG" -m "$MESSAGE"
          git push origin "$TAG"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://npm.pkg.github.com/'

      - name: Setup Java and Maven
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          server-id: github
          server-username: ${{ github.actor }}
          server-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify versions match
        run: |
          TAG="${{ steps.versioning.outputs.tag }}"
          TAG_VER="${TAG#v}"
          NPM_VER=$(node -p "require('./package.json').version")
          POM_VER=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          
          if [ "$NPM_VER" != "$TAG_VER" ] || [ "$POM_VER" != "$TAG_VER" ]; then
            echo "Mismatch: Tag ($TAG_VER), package.json ($NPM_VER), pom.xml ($POM_VER)" >&2
            exit 1
          fi

      - name: Publish npm package
        if: ${{ inputs.publish_npm }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          SCOPE=$(node -p "require('./package.json').name.split('/')[0].slice(1)")
          AUTH_TOKEN="${NPM_TOKEN:-$GITHUB_TOKEN}"
          
          echo "@${SCOPE}:registry=https://npm.pkg.github.com/" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${AUTH_TOKEN}" >> .npmrc
          
          npm ci
          npm run build
          
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION_TO_PUBLISH="${{ steps.versioning.outputs.version }}"
          
          set +e
          EXISTING=$(npm view "${PACKAGE_NAME}@${VERSION_TO_PUBLISH}" version --registry=https://npm.pkg.github.com || true)
          set -e
          if [ "${EXISTING}" = "${VERSION_TO_PUBLISH}" ]; then
            echo "Version ${VERSION_TO_PUBLISH} already published to NPM registry. Aborting." >&2
            exit 1
          fi
          
          npm publish --registry=https://npm.pkg.github.com --access public

      - name: Publish Maven package
        if: ${{ inputs.publish_maven }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          GROUP_ID=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.groupId)
          ARTIFACT_ID=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.artifactId)
          VERSION="${{ steps.versioning.outputs.version }}"
          GROUP_PATH=$(echo "$GROUP_ID" | sed 's/\./\//g')
          
          URL="https://maven.pkg.github.com/${{ github.repository }}/$GROUP_PATH/$ARTIFACT_ID/$VERSION/$ARTIFACT_ID-$VERSION.pom"
          
          set +e
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "${GITHUB_ACTOR}:${GITHUB_TOKEN}" "$URL")
          set -e
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Artifact $ARTIFACT_ID:$VERSION already exists in Maven registry. Aborting." >&2
            exit 1
          fi
          
          mkdir -p "$HOME/.m2"
          printf '%s\n' "<settings xmlns=\"http://maven.apache.org/SETTINGS/1.0.0\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd\">" > "$HOME/.m2/settings.xml"
          printf '%s\n' "  <servers><server><id>github</id><username>${GITHUB_ACTOR}</username><password>${GITHUB_TOKEN}</password></server></servers>" >> "$HOME/.m2/settings.xml"
          printf '%s\n' "</settings>" >> "$HOME/.m2/settings.xml"
          
          mvn -B -DskipTests deploy -s "$HOME/.m2/settings.xml"

      - name: Create Release PR for version bump
        if: ${{ success() && steps.versioning.outputs.is_bumped == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VER="${{ steps.versioning.outputs.version }}"
          BRANCH_NAME="chore/release-v${NEW_VER}"
          
          echo "Creating Release PR for version $NEW_VER on branch $BRANCH_NAME"
          
          git checkout -b "$BRANCH_NAME"
          git add package.json package-lock.json pom.xml
          git commit -m "chore(release): bump version to $NEW_VER [skip ci]"
          git push origin "$BRANCH_NAME" --force
          
          gh pr create \
            --title "chore(release): bump version to $NEW_VER" \
            --body "Automated release version bump following publishing v$NEW_VER to GitHub Packages." \
            --base main \
            --head "$BRANCH_NAME" || echo "PR already exists"
          
          gh pr merge "$BRANCH_NAME" --squash --auto || echo "Auto-merge enabled or already merged"
